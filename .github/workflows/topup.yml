name: Genera nuove curiosita'

# Ogni giorno alle 06:00 UTC. Genera nuovi script solo se quelli rimasti stanno
# per finire E se ANTHROPIC_API_KEY e' impostata.
#
# Era SETTIMANALE (lunedi'). Il controllo in se' non costa nulla: l'API viene
# chiamata solo quando la coda e' sotto soglia, negli altri giorni il job legge
# due file ed esce. Il controllo settimanale invece aveva un buco reale: fra due
# lunedi' publish.yml consuma 21 script (3 al giorno), quindi una coda sopra
# soglia il lunedi' poteva essere a zero il giovedi' senza che nessun job avesse
# mai provato a rifornirla.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  topup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa anthropic
        run: pip install anthropic

      - name: Genera nuovi script se servono
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/generate_scripts.py

      - name: Committa i nuovi script
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/english_scripts_*.json
          git diff --staged --quiet || git commit -m "Nuove curiosita' generate [skip ci]"
          git push
