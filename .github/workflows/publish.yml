name: Publish YouTube Short

# ⏸️ CRON SOSPESO il 2026-07-13: gli upload via API vengono bloccati come
# privati finché il progetto Google Cloud non supera il Compliance Audit
# YouTube (form inviato, in attesa di esito). Ogni run consumava uno script
# in un video invisibile. Riattivare togliendo i commenti dopo l'approvazione.
# Orari originali (UTC = 09/14/19 ora italiana in estate):
on:
  # schedule:
  #   - cron: "0 7 * * *"
  #   - cron: "0 12 * * *"
  #   - cron: "0 17 * * *"
  workflow_dispatch:   # permette di lanciarlo a mano dal sito GitHub

permissions:
  contents: write       # per ri-committare state.json

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa ffmpeg e font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Installa dipendenze Python
        run: pip install -r requirements.txt

      - name: Scrivi il token YouTube
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: printf '%s' "$YT_TOKEN" > yt_token.json

      - name: Genera e pubblica il prossimo Short
        run: python cloud_publish.py

      - name: Salva lo stato aggiornato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Avanza al prossimo script [skip ci]"
          git push
