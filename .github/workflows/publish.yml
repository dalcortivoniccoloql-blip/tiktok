name: Publish YouTube Short

# ▶️ CRON RIACCESO il 2026-08-02 — ma la PUBBLICAZIONE resta spenta.
#
# Storia breve: il cron era sospeso dal 2026-07-13 perché senza l'approvazione
# del Compliance Audit YouTube ogni upload viene bloccato come privato e BRUCIA
# uno script (il contatore avanza, il video resta invisibile e va ricaricato da
# zero). Tenerlo spento era giusto — ma aveva un costo nascosto: nessuno aveva
# mai visto questa automazione girare davvero nel cloud.
#
# Ora le due cose sono separate:
#   - la SCHEDULAZIONE è attiva → ogni run è un CONTROLLO DI SALUTE (checkout,
#     dipendenze, ffmpeg, caricamento script). Non pubblica, non tocca le
#     credenziali, non muove state.json.
#   - la PUBBLICAZIONE si accende con la variabile di repository
#     PUBLISH_ENABLED=true (Settings > Secrets and variables > Actions >
#     Variables). Il giorno dell'approvazione basta quella: niente commit,
#     niente push, nessuno scope 'workflow' richiesto.
#
# ⛔ NON impostare PUBLISH_ENABLED finché non arriva l'EMAIL di approvazione
# dell'audit. Stato dell'invio: DA CONFERMARE con l'owner (il form era
# in compilazione il 2026-08-02). Una volta inviato davvero, l'esito arriva
# da giorni a settimane. Guida e stato su Drive:
# idee/elenco/P09-.../faceless-shorts/audit-youtube-api/guida-compilazione-audit.md
#
# Orari UTC = 09/14/19 ora italiana in estate:
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:   # permette di lanciarlo a mano dal sito GitHub

permissions:
  contents: write       # per ri-committare state.json

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa ffmpeg e font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Installa dipendenze Python
        run: pip install -r requirements.txt

      - name: Scrivi il token YouTube
        env:
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
        run: printf '%s' "$YT_TOKEN" > yt_token.json

      - name: Genera e pubblica il prossimo Short
        env:
          # Interruttore di pubblicazione. Se non e' "true" il run e' un semplice
          # controllo di salute: non pubblica e non muove state.json.
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          # Instagram Reels (opzionali: senza questi secret l'upload IG viene saltato)
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TRANSFER_REPO:   ${{ secrets.TRANSFER_REPO }}
          TRANSFER_TOKEN:  ${{ secrets.TRANSFER_TOKEN }}
        run: python cloud_publish.py

      - name: Salva lo stato aggiornato
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Avanza al prossimo script [skip ci]"
          git push
